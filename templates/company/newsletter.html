<!-- newsletter.html -->
<!DOCTYPE html>
{% extends 'company/base.html' %}

{% block title %}Newsletter - VUM Games{% endblock %}

{% block content %}
<div class="container" style="padding: 140px 0 100px;">
    <div class="row justify-content-center">
        <div class="col-lg-9">
            {% if header %}
            <div class="text-center mb-5">
                <h1 class="section-title">{{ header.title }}</h1>
                {% if header.content %}
                <p class="section-subtitle">{{ header.content }}</p>
                {% endif %}
            </div>
            {% endif %}

            {% include 'company/partials/_newsletter.html' %}
        </div>
    </div>
</div>
{% endblock %}
